<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSINT // TACTICAL DASHBOARD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <!-- exifr: superior EXIF parser — handles GPS, all EXIF fields, RAW formats -->
  <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ════════════════════════════════════════════
     TOP BAR
════════════════════════════════════════════ -->
  <div id="topbar">
    <div class="logo">OSINT<em>//</em>TACTICAL</div>
    <div class="tb-sep"></div>
    <div class="tb-stat">
      <div class="led g"></div>SYSTEM ONLINE
    </div>
    <div class="tb-stat">
      <div class="led b"></div>FEEDS: <span id="tb-feeds" style="color:var(--text);margin-left:3px">–</span>
    </div>
    <div class="tb-stat">
      <div class="led g" style="background:var(--blue)"></div>CAMS: <span id="tb-cams"
        style="color:var(--text);margin-left:3px">–</span>
    </div>
    <div class="tb-stat">
      <div class="led a"></div>FLIGHTS: <span id="tb-flt" style="color:var(--text);margin-left:3px">–</span>
    </div>
    <div class="tb-stat">
      <div class="led r"></div>FIRES: <span id="tb-fire" style="color:var(--text);margin-left:3px">–</span>
    </div>
    <div id="coord-disp">LAT: – &nbsp; LNG: –</div>
    <div id="clock">––:––:–– UTC</div>
    <button id="theme-toggle" onclick="toggleTheme()">◑ THEME</button>
    <button class="mtbtn" id="btn-export" onclick="exportSession()" style="font-size:9px;padding:3px 8px">⬇
      EXPORT</button>
    <button class="mtbtn" id="btn-pins" onclick="togglePinsPanel()">📍 PINS</button>
  </div>

  <!-- ════════════════════════════════════════════
     MAIN NAVIGATION
════════════════════════════════════════════ -->
  <div id="mainnav">
    <button class="mnav-btn active" onclick="switchSection('map',this)">MAP</button>
    <button class="mnav-btn" onclick="switchSection('meta',this)">METADATA</button>
    <button class="mnav-btn" onclick="switchSection('radio',this)">RADIO</button>
    <button class="mnav-btn" onclick="switchSection('tools',this)">TOOLS</button>
    <div class="mnav-sep"></div>
    <div id="coord-search-wrap">
      <input id="coord-search-input" placeholder="Search location or lat,lng…"
        onkeydown="if(event.key==='Enter')doCoordSearch()" />
      <button id="coord-search-btn" onclick="doCoordSearch()">GO</button>
      <div id="coord-search-results"></div>
    </div>
  </div>

  <!-- ════════════════════════════════════════════
     SECTION PLACEHOLDERS — injected by sections/*.js
════════════════════════════════════════════ -->
  <div id="sec-map-wrap"></div>
  <div id="sec-meta-wrap"></div>
  <div id="sec-radio-wrap"></div>
  <div id="sec-tools-wrap"></div>
  <div id="panels-wrap"></div>

  <!-- Section HTML files -->
  <script src="sections/map.js"></script>
  <script src="sections/metadata.js"></script>
  <script src="sections/radio.js"></script>
  <script src="sections/tools.js"></script>
  <script src="sections/panels.js"></script>

  <!-- Main application script -->
  <script src="script.js"></script>

</body>

</html>
